name: Compilar BotW con Shaders Integrados

on:
  workflow_dispatch:
    inputs:
      hf_token:
        description: 'Tu Token de Hugging Face (con permiso Write)'
        required: true
      hf_repo:
        description: 'Nombre de tu Dataset en HuggingFace (ej: santx11/botw-ios)'
        required: true

jobs:
  build_all:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Liberar espacio en el disco
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode_15* /Applications/Xcode_16* || true
          sudo rm -rf ~/Library/Caches/*

      - name: Instalar dependencias
        run: |
          brew install opus libvpx python@3.14 xcodegen cmake ninja uv
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Clonar MacNativeGames
        run: |
          git clone https://github.com/ly05010419/MacNativeGames.git

      - name: Descargar archivos del juego
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: |
          mkdir -p datos
          /opt/homebrew/bin/uv run --with huggingface_hub python -c "
          import os
          from huggingface_hub import hf_hub_download

          token = os.environ.get('HF_TOKEN')
          repo = os.environ.get('HF_REPO')

          print('Descargando pack.zip...')
          hf_hub_download(
              repo_id=repo,
              filename='pack.zip',
              repo_type='dataset',
              local_dir='datos',
              token=token
          )
          print('Descarga completada.')
          "
          echo "Descomprimiendo archivos..."
          unzip -o -q datos/pack.zip -d datos/
          rm -f datos/pack.zip

      - name: Parchear firmas de Xcode
        run: |
          cd MacNativeGames
          find . -type f \( -name "*.py" -o -name "*.yml" -o -name "*.pbxproj" \) -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' {} + || true
          find . -type f -name "*.py" -exec sed -i '' 's/"xcodebuild"/"xcodebuild", "CODE_SIGN_IDENTITY=", "CODE_SIGNING_REQUIRED=NO", "CODE_SIGNING_ALLOWED=NO"/g' {} + || true

      - name: Compilar juego y shaders
        run: |
          cd MacNativeGames
          /opt/homebrew/bin/python3.14 build_app.py "../datos/base.nsp" -k "../datos/prod.keys" --update "../datos/update.nsp" --dlc "../datos/dlc1.nsp" --dlc "../datos/dlc2.nsp" --firmware "../datos/firmware" --platform ios --ios-game-data documents -o "../Breath of the Wild.ipa"

      - name: Inyectar shaders dentro del IPA
        run: |
          mkdir -p ipa_mod
          unzip -q "Breath of the Wild.ipa" -d ipa_mod
          APP_DIR=$(find ipa_mod/Payload -maxdepth 1 -name "*.app")
          
          # Copiar la carpeta shader-cache y semillas al interior del paquete .app
          mkdir -p "$APP_DIR/shader-cache"
          mkdir -p "$APP_DIR/GameData/shader-cache"
          
          cp -r "$HOME/Library/Application Support/MacNativeGames/BotW/shader-cache"/* "$APP_DIR/shader-cache/" 2>/dev/null || true
          cp -r "$HOME/Library/Application Support/MacNativeGames/BotW/shader-cache"/* "$APP_DIR/GameData/shader-cache/" 2>/dev/null || true
          find datos/BotW_build -type d -name "shader-cache" -exec cp -r {}/* "$APP_DIR/shader-cache/" \; 2>/dev/null || true
          find datos/BotW_build -type d -name "shader-cache" -exec cp -r {}/* "$APP_DIR/GameData/shader-cache/" \; 2>/dev/null || true
          find datos/BotW_build -name "*seed*" -exec cp {} "$APP_DIR/" \; 2>/dev/null || true
          find datos/BotW_build -name "*.metallib" -exec cp {} "$APP_DIR/" \; 2>/dev/null || true
          
          # Volver a comprimir el IPA con los shaders integrados
          cd ipa_mod
          zip -qr -9 "../Breath of the Wild_final.ipa" Payload
          cd ..
          rm -rf ipa_mod "Breath of the Wild.ipa"

      - name: Subir IPA final a Hugging Face
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: |
          /opt/homebrew/bin/uv tool run --from huggingface_hub hf upload "$HF_REPO" "Breath of the Wild_final.ipa" "Breath of the Wild.ipa" --repo-type dataset --token "$HF_TOKEN"
