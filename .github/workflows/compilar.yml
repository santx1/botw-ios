name: Extraer Solo RomFS 15GB

on:
  workflow_dispatch:
    inputs:
      hf_token:
        description: 'Tu Token de Hugging Face (con permiso Write)'
        required: true
      hf_repo:
        description: 'Nombre de tu Dataset en HuggingFace (ej: santx11/botw-ios)'
        required: true

jobs:
  extract_romfs:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Instalar Python 3.14 y uv
        run: |
          brew install opus libvpx python@3.14 uv

      - name: Descargar MacNativeGames
        run: |
          git clone https://github.com/ly05010419/MacNativeGames.git

      - name: Descargar tus archivos del juego desde Hugging Face
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: |
          mkdir -p datos
          /opt/homebrew/bin/uv tool run --from huggingface_hub hf download "$HF_REPO" pack.zip --repo-type dataset --local-dir datos --token "$HF_TOKEN"
          unzip datos/pack.zip -d datos/
          rm datos/pack.zip

      - name: Parar el script justo después de crear el romfs.bin de 15 GB (Paso 2/4)
        run: |
          cd MacNativeGames
          # Hacemos que el script termine con éxito justo cuando acabe el paso 2/4 data, sin compilar shaders
          find . -type f -name "*.py" -exec sed -i '' 's/3\/4 shaders: building SPIRV-Cross/DONE_DATA_STOP/g' {} + || true
          
          # Ejecutamos hasta que imprima DONE_DATA_STOP y en ese segundo cortamos para subir el archivo
          (/opt/homebrew/bin/python3.14 build_app.py "../datos/base.nsp" -k "../datos/prod.keys" --update "../datos/update.nsp" --dlc "../datos/dlc1.nsp" --dlc "../datos/dlc2.nsp" --firmware "../datos/firmware" --platform ios --ios-game-data documents -o "../Breath of the Wild.ipa" 2>&1 | tee build.log &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            if grep -q "3/4 shaders" build.log || grep -q "DONE_DATA_STOP" build.log; then
              echo "RomFS de 15 GB e importación de DLCs terminados. Cortando compilación de shaders..."
              kill -9 $PID || true
              break
            fi
            sleep 5
          done)

      - name: Subir el romfs.bin de 15 GB y los DLCs a Hugging Face
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: |
          ls -lh datos/BotW_build/totk/extracted/botw160/romfs/romfs.bin
          /opt/homebrew/bin/uv tool run --from huggingface_hub hf upload "$HF_REPO" "datos/BotW_build/totk/extracted/botw160/romfs/romfs.bin" "romfs.bin" --repo-type dataset --token "$HF_TOKEN"
