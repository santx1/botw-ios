name: Compilar BotW con Shaders Integrados

on:
  workflow_dispatch:
    inputs:
      hf_token:
        description: 'Tu Token de Hugging Face (con permiso Write)'
        required: true
      hf_repo:
        description: 'Nombre de tu Dataset en HuggingFace (ej: santx11/botw-ios)'
        required: true

jobs:
  build_all:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /Library/Developer/CoreSimulator
          sudo rm -rf /Applications/Xcode_15* /Applications/Xcode_16* || true
          sudo rm -rf ~/Library/Caches/*

      - name: Instalar dependencias
        run: |
          brew install opus libvpx python@3.14 xcodegen cmake ninja uv
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Clonar MacNativeGames
        run: |
          git clone https://github.com/ly05010419/MacNativeGames.git

      - name: Descargar archivos del juego
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: |
          mkdir -p datos
          /opt/homebrew/bin/uv run --with huggingface_hub python -c "
          import os
          from huggingface_hub import hf_hub_download

          token = os.environ.get('HF_TOKEN')
          repo = os.environ.get('HF_REPO')

          print('Descargando pack.zip...')
          hf_hub_download(
              repo_id=repo,
              filename='pack.zip',
              repo_type='dataset',
              local_dir='datos',
              token=token
          )
          print('Descarga completada.')
          "
          echo "Descomprimiendo archivos..."
          unzip -o -q datos/pack.zip -d datos/
          rm -f datos/pack.zip

      - name: Parchear firmas de Xcode y enlaces de shaders
        run: |
          cd MacNativeGames
          find . -type f \( -name "*.py" -o -name "*.yml" -o -name "*.pbxproj" \) -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' {} + || true
          find . -type f -name "*.py" -exec sed -i '' 's/"xcodebuild"/"xcodebuild", "CODE_SIGN_IDENTITY=", "CODE_SIGNING_REQUIRED=NO", "CODE_SIGNING_ALLOWED=NO"/g' {} + || true
          
          # Reemplazar os.link por copia directa para evitar el error 92 en APFS
          find . -type f -name "prepare_shader_seed.py" -exec sed -i '' "s/os.link(staging\/name, self.folder\/name)/__import__('shutil').copyfile(staging\/name, self.folder\/name)/g" {} +
      - name: Compilar juego y shaders
        run: |
          cd MacNativeGames
          /opt/homebrew/bin/python3.14 build_app.py "../datos/base.nsp" -k "../datos/prod.keys" --update "../datos/update.nsp" --dlc "../datos/dlc1.nsp" --dlc "../datos/dlc2.nsp" --firmware "../datos/firmware" --platform ios --ios-game-data documents -o "../Breath of the Wild.ipa"

      - name: Inyectar shader-seed dentro del IPA
        run: |
          # Localizar la carpeta que contiene el archivo seed-manifest.json
          SEED_DIR=$(find . -maxdepth 4 -type f -name "seed-manifest.json" -exec dirname {} + | head -n 1)
          echo "Carpeta shader-seed encontrada en: $SEED_DIR"

          if [ -z "$SEED_DIR" ]; then
            echo "ERROR: No se encontró seed-manifest.json en el entorno de compilación."
            exit 1
          fi

          # Descomprimir el IPA generado
          mkdir -p ipa_mod
          unzip -q "Breath of the Wild.ipa" -d ipa_mod
          APP_DIR=$(find ipa_mod/Payload -maxdepth 1 -name "*.app")

          # Crear la carpeta shader-seed interna y copiar todo su contenido
          mkdir -p "$APP_DIR/shader-seed"
          cp -R "$SEED_DIR"/* "$APP_DIR/shader-seed/"

          # Reempaquetar el IPA conservando enlaces simbolicos
          rm -f "Breath of the Wild.ipa"
          cd ipa_mod
          zip -qry -9 "../Breath of the Wild.ipa" Payload
          cd ..
          rm -rf ipa_mod

      - name: Subir IPA final a Hugging Face
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: |
          /opt/homebrew/bin/uv tool run --from huggingface_hub hf upload "$HF_REPO" "Breath of the Wild.ipa" "Breath of the Wild.ipa" --repo-type dataset --token "$HF_TOKEN"
