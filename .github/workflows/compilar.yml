- name: Descargar archivos del juego
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          HF_REPO: ${{ github.event.inputs.hf_repo }}
        run: |
          mkdir -p datos
          /opt/homebrew/bin/python3.14 -c "
          import os
          from huggingface_hub import hf_hub_download

          token = os.environ.get('HF_TOKEN')
          repo = os.environ.get('HF_REPO')

          print('Iniciando descarga directa de pack.zip...')
          hf_hub_download(
              repo_id=repo,
              filename='pack.zip',
              repo_type='dataset',
              local_dir='datos',
              token=token
          )
          print('Descarga completada.')
          "
          echo "Descomprimiendo archivos..."
          unzip -o -q datos/pack.zip -d datos/
          rm -f datos/pack.zip
          ls -la datos/
